version: 2

models:
  - name: int_customers
    description: Accepted customers after source validation failures are excluded.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: int_products
    description: Accepted products after source validation failures are excluded.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: int_promotions
    description: Accepted promotion definitions.
    columns:
      - name: promotion_id
        data_tests: [unique, not_null]

  - name: int_orders
    description: Accepted orders whose customer and optional promotion are conformed.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_customers')
                field: customer_id
      - name: promotion_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_promotions')
                field: promotion_id

  - name: int_order_items
    description: Accepted order lines with conformed order and product parents.
    columns:
      - name: line_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_products')
                field: product_id

  - name: int_returns
    description: Accepted return events with conformed order-line parents.
    columns:
      - name: return_id
        data_tests: [unique, not_null]
      - name: line_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_order_items')
                field: line_id

  - name: int_promotion_assignments
    description: One accepted promotion assignment per promoted order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: promotion_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_promotions')
                field: promotion_id

  - name: int_rejected_records
    description: Direct validation and derived parent-conformance rejection rules for the current load.
    columns:
      - name: load_id
        data_tests: [not_null]
      - name: source_table
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["customers", "products", "promotions", "orders", "order_items", "returns"]
      - name: source_row
        data_tests: [not_null]
      - name: source_file
        data_tests: [not_null]
      - name: rule_code
        data_tests: [not_null]
      - name: reason
        data_tests: [not_null]
