[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-data-analysis"
version = "1.1.0"
description = "Reproducible sales analytics portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dbt-core==1.12.1",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "pandera==0.32.1",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.1.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
